apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: get200 # Fixed: Changed from GET200
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: get200-app-api # Fixed: Changed from backend to target your actual deployment name
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 0
