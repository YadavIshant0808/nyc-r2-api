apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migrate
  namespace: get200
spec:
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: backend-ksa
      restartPolicy: Never
      # Using Kubernetes native sidecar container (initContainer with restartPolicy: Always).
      # The proxy starts first, and once the main "migrate" container exits,
      # Kubernetes automatically terminates the proxy so the Job can finish.
      initContainers:
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.0
          restartPolicy: Always
          args:
            - "--structured-logs"
            - "--port=5432"
            - "project-2505dfd6-33dd-47f2-ab6:asia-south1:get200-db"
          securityContext:
            runAsNonRoot: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
      containers:
        - name: migrate
          image: asia-south1-docker.pkg.dev/project-2505dfd6-33dd-47f2-ab6/get200-app-api-repo/backend:latest
          command:
            - sh
            - -c
            - "sleep 3 && alembic upgrade head"
          env:
            # Connects via the Cloud SQL Auth Proxy sidecar on localhost
            - name: DATABASE_URL
              value: "postgresql://postgres:Nychacks%400808@127.0.0.1:5432/get200"
            - name: CLERK_ISSUER
              value: "https://guiding-jennet-79.clerk.accounts.dev"
            - name: CLERK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: get200-secrets
                  key: CLERK_SECRET_KEY
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
