apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: get200 # Fixed: Changed from myapp
spec:
  selector:
    app: get200-api # Fixed: Changed from backend to match the deployment's app label
  ports:
    - port: 80
      targetPort: 8080 # Matches Dockerfile & Deployment containerPort
  type: ClusterIP
